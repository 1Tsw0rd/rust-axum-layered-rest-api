[package]
name = "rust-axum-layered-rest-api"   # 리포지토리/패키지 식별용 이름
version = "0.1.0"                     # 패키지 버전
edition = "2024"                      # 사용할 Rust edition(cargo new 기본값)

[[bin]]
name = "my_app"           # 우리가 실행할 프로그램(main.rs)의 이름을 'my_app'으로 지어줌
path = "src/main.rs"      # 실행 파일이 src/main.rs에 있다고 컴파일러에게 위치를 알려줌

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
